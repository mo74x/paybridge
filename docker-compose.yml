version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: paybridge-postgres
    environment:
      POSTGRES_USER: pb_user
      POSTGRES_PASSWORD: pb_password
      POSTGRES_DB: paybridge_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: paybridge-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: